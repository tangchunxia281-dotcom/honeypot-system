<!doctype html><html lang="zh-CN"><head><meta name="color-scheme" content="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>本机证据调查 · 蜜罐</title><link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css',v=ASSET_VERSION) }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/ai_shell.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/competition.css') }}"></head>
<body class="ai-workspace">{% include 'ai_sidebar.html' %}<main class="ai-main"><header><p class="eyebrow">单机参赛版 · 原文可查 · 判断可复核</p><h1>本机证据调查</h1><p>程序记录事实，AI补充解释。模型关闭时仍可索引、筛选和查看程序时间线。</p></header>
<nav class="local-tabs"><button data-view="evidence">证据资料</button><button data-view="story">攻击故事线</button><button data-view="active">主动补查</button><button data-view="effects">调查效果</button><button id="sync">索引本机新记录</button></nav>
<p id="localNotice" role="status">正在读取本机索引…</p><section class="panel filters"><label>来源IP<input id="ip" maxlength="64" placeholder="留空显示全部"></label><label>会话<input id="session" maxlength="128"></label><label>关键词<input id="term" maxlength="80"></label><label>开始时间（北京）<input id="start" type="datetime-local"></label><label>结束时间（北京）<input id="end" type="datetime-local"></label><button id="filter">应用筛选</button></section>
<section id="evidence" class="panel"></section><section id="story" class="panel" hidden></section>
<section id="active" class="panel" hidden><h2>主动补查</h2><p>最多3次补查，60条候选、12条代表证据，总预算90秒。模型未启用或失败时保留程序时间线；补查只查询本机索引。</p><label>调查问题<textarea id="question" maxlength="500" rows="3" placeholder="请补查这些请求前后的行为，按证据说明攻击阶段和无法确认的事项。"></textarea></label><button id="investigate">发起调查</button><div id="jobs"></div><div id="job"></div></section>
<section id="effects" class="panel" hidden></section><dialog id="rawDialog"><button id="closeRaw">关闭</button><h2>索引证据（已脱敏和限长）</h2><pre id="raw"></pre></dialog><footer>索引只覆盖当前配置的SQLite活动库，每批最多100条/表；不会自动扫描旧目录。未标记流量不作为真实攻击成果。历史AI结果不等于实时生成。</footer></main><script src="{{ url_for('static',filename='js/ai_shell.js') }}" defer></script><script src="{{ url_for('static',filename='js/local_investigation.js') }}" defer></script></body></html>
