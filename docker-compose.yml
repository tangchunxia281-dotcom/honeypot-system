# 网络威胁态势感知与蜜罐诱捕系统 - 一键部署
# 用法: docker compose up -d --build
services:
  honeypot:
    build: .
    image: honeypot-system:latest
    container_name: honeypot-system
    restart: unless-stopped
    ports:
      - "2222:2222"   # SSH 蜜罐
      - "5000:5000"   # Web 蜜罐
      - "5001:5001"   # Dashboard（管理界面，建议仅内网/反代暴露）
    volumes:
      - honeypot-database:/app/database      # SQLite 库与归档
      - honeypot-logs:/app/logs              # 运行日志
      # 可选：使用本机自定义配置（取消注释并把 honeypot.ini 放到本目录）
      # - ./honeypot.ini:/app/honeypot.ini:ro
    environment:
      TZ: Asia/Shanghai
      # 环境变量优先级高于 honeypot.ini，常用项示例：
      # PRODUCTION_MODE: "true"
      # ADMIN_PASS: "请改成强口令"
      # ALERT_WEBHOOK_URL: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"
    healthcheck:
      # Dashboard 存活即视为系统存活（main.py 会自动重启其余子进程）
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen('http://127.0.0.1:%s/' % os.environ.get('DASHBOARD_PORT','5001'), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  honeypot-database:
  honeypot-logs:
