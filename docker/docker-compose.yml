# 设备 B 同机部署用：只使用已导入的镜像，不构建
# 用法：docker compose -f docker-compose.yml up -d
services:
  detector:
    image: xss-detector:2.0.0
    container_name: xss-detector
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    environment:
      HONEYPOT_LOG_PATH: /app/logs/honeypot_events.jsonl
      LOG_TO_STDOUT: "1"
      TZ: Asia/Shanghai
    volumes:
      - xss-logs:/app/logs
    security_opt:
      - no-new-privileges:true

volumes:
  xss-logs:
    name: xss-detector-logs
