<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f2f5"/>
      <stop offset="1" stop-color="#e6f4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#36cfc9" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.75" filter="url(#blur)">
    <circle cx="260" cy="220" r="180" fill="url(#accent)"/>
    <circle cx="1320" cy="240" r="220" fill="url(#accent)"/>
    <circle cx="980" cy="760" r="260" fill="url(#accent)"/>
  </g>

  <g opacity="0.25" fill="none" stroke="#1677ff" stroke-width="2">
    <path d="M120 720 C 260 620, 380 660, 520 560"/>
    <path d="M980 140 C 1110 120, 1260 170, 1420 110"/>
    <path d="M520 860 C 700 760, 860 820, 1040 720"/>
  </g>

  <g opacity="0.18" fill="#ffffff">
    <rect x="160" y="120" width="120" height="10" rx="5"/>
    <rect x="1480" y="300" width="90" height="10" rx="5"/>
    <rect x="820" y="80" width="140" height="10" rx="5"/>
    <rect x="260" y="820" width="110" height="10" rx="5"/>
  </g>
</svg>
