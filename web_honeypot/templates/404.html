<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
            background: linear-gradient(180deg, #f6f8fa 0%, #eef2f6 100%);
            color: #333;
        }
        .wrap { max-width: 880px; margin: 0 auto; padding: 44px 18px; }
        .panel {
            background: #fff;
            border: 1px solid #e1e4e8;
            box-shadow: 0 10px 30px rgba(0,0,0,.06);
            border-radius: 10px;
            overflow: hidden;
        }
        .hd {
            padding: 18px 22px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
            display: flex;
            align-items: center;
            gap: 14px;
            border-radius: 4px 4px 0 0;
        }
        .face {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #e9e9e9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #666;
            font-size: 22px;
        }
        .title { font-size: 16px; font-weight: 600; color: #222; }
        .sub { margin-top: 4px; font-size: 12px; color: #777; }
        .bd { padding: 18px 22px 22px; }
        .msg { font-size: 14px; line-height: 1.6; color: #333; margin-bottom: 14px; }
        .meta {
            font-size: 12px;
            color: #57606a;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            padding: 4px 10px;
            border-radius: 999px;
        }
        .meta code { background: transparent; padding: 0; border-radius: 0; }
        .trace { border-top: 1px solid #eee; padding-top: 14px; }
        .trace h3 { margin: 0 0 10px; font-size: 13px; color: #444; }
        .footer { text-align: center; color: #999; font-size: 12px; padding: 14px 0 0; }
        .error-details {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #6c757d;
        }
        .error-details h4 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #333;
        }
        .error-details ol {
            margin: 0;
            padding-left: 18px;
        }
        .error-details li {
            margin: 6px 0;
            font-size: 13px;
            color: #444;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
            justify-content: flex-end;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #d0d7de;
            background: #fff;
            color: #24292e;
            text-decoration: none;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
        }
        .btn.primary {
            background: #0a58ca;
            border-color: #0a58ca;
            color: #fff;
        }
        .btn.secondary {
            background: #f6f8fa;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="panel">
            <div class="hd">
                <div class="face">:(</div>
                <div>
                    <div class="title">404 Not Found</div>
                    <div class="sub">Portal Service - System Message</div>
                </div>
            </div>
            <div class="bd">
                <div class="msg">页面不存在或已被移除。</div>
                <div class="meta">
                    <span class="meta-item">URL: <code>{{ request.path }}</code></span>
                    <span class="meta-item">Time: <code>{{ current_time|default('—') }}</code></span>
                    <span class="meta-item">Request ID: <code id="rid">-</code></span>
                </div>

                <div class="trace">
                    <div class="error-details">
                        <ol>
                            <li>请检查访问地址是否正确</li>
                            <li>返回上一页或回到首页</li>
                            <li>如问题持续，请将 Request ID 提供给管理员以便排查</li>
                        </ol>
                    </div>

                    <div class="actions">
                        <a class="btn primary" href="/">返回首页</a>
                        <button class="btn secondary" type="button" onclick="history.back()">返回上一页</button>
                    </div>
                </div>

                <div class="footer">Powered by {{ app_framework|default('nginx') }}</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var ridEl = document.getElementById('rid');
            if (!ridEl) return;

            var ts = Date.now().toString(36);
            var rnd = Math.random().toString(36).slice(2, 10);
            ridEl.textContent = (ts + '-' + rnd).toUpperCase();
        })();
    </script>
</body>
</html>
