<svg width="1152" height="295" viewBox="0 0 1152 295" xmlns="http://www.w3.org/2000/svg"><g font-family="Microsoft YaHei"><rect x="0" y="24" width="340" height="100" rx="8" fill="rgba(79,179,217,0.10)" stroke="rgba(79,179,217,0.32)" stroke-width="1" /><text x="24" y="58" font-size="18" font-weight="bold" fill="#E8F1F8">路径 A · 人工标注</text><text x="24" y="86" font-family="Consolas" font-size="14" fill="#4FB3D9">service.mark(type, value, level, ...)</text><text x="24" y="110" font-size="13" fill="rgba(232,241,248,0.66)">管理端手工填写：密级 + 原因 + 有效期</text><rect x="0" y="156" width="340" height="100" rx="8" fill="rgba(79,179,217,0.10)" stroke="rgba(79,179,217,0.32)" stroke-width="1" /><text x="24" y="190" font-size="18" font-weight="bold" fill="#E8F1F8">路径 B · 自动识别</text><text x="24" y="218" font-family="Consolas" font-size="14" fill="#4FB3D9">run_detectors(context)</text><text x="24" y="242" font-size="13" fill="rgba(232,241,248,0.66)">内置 severity / repeat_offender 两个识别器</text><path d="M340 74 H390 V100 H418" stroke="#4FB3D9" stroke-width="2" fill="none" /><polygon points="424,100 412,94 412,106" fill="#4FB3D9" /><path d="M340 206 H405 V158 H418" stroke="#4FB3D9" stroke-width="2" fill="none" /><polygon points="424,158 412,152 412,164" fill="#4FB3D9" /><rect x="424" y="58" width="290" height="142" rx="8" fill="rgba(232,163,61,0.10)" stroke="rgba(232,163,61,0.55)" stroke-width="2" /><text x="569" y="92" font-size="18" font-weight="bold" fill="#E8A33D" text-anchor="middle">汇流写入</text><text x="569" y="122" font-family="Consolas" font-size="16" fill="#E8F1F8" text-anchor="middle">apply_upserts()</text><text x="569" y="152" font-size="13" fill="rgba(232,241,248,0.66)" text-anchor="middle">source = manual</text><text x="569" y="174" font-size="13" fill="rgba(232,241,248,0.66)" text-anchor="middle">source = detector:<name></text><path d="M714 129 H788" stroke="#4FB3D9" stroke-width="2" fill="none" /><polygon points="794,129 782,123 782,135" fill="#4FB3D9" /><rect x="794" y="58" width="358" height="142" rx="8" fill="rgba(79,179,217,0.18)" stroke="rgba(79,179,217,0.32)" stroke-width="1" /><text x="818" y="92" font-size="18" font-weight="bold" fill="#4FB3D9">一张表 risk_mark</text><text x="818" y="122" font-family="Consolas" font-size="14" fill="#E8F1F8">UNIQUE (target_type, target_value)</text><text x="818" y="152" font-size="13" fill="rgba(232,241,248,0.66)">首次使用时自动建表，SQLite / MySQL 双适配</text><text x="818" y="178" font-size="13" fill="rgba(232,241,248,0.66)">不 ALTER 任何既有表，不碰既有接口签名</text></g></svg>